
services:

  app1:
    build: .
    container_name: cloud-app-1
    environment:
      SERVER_PORT: 8080

  app2:
    build: .
    container_name: cloud-app-2
    environment:
      SERVER_PORT: 8080

  nginx:
    image: nginx:alpine
    container_name: cloud-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2